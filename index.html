<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comuni d’Italia 🇮🇹</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: white;
      padding: 18px 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: relative;
      z-index: 1000;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    #progress {
      font-size: 18px;
      font-weight: bold;
    }

    #counter {
      margin-top: 5px;
      color: #666;
      font-size: 14px;
    }

    #map {
      width: 100%;
      height: calc(100vh - 125px);
      min-height: 500px;
    }

    .legend {
      background: white;
      padding: 10px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      line-height: 22px;
    }

    .legend span {
      display: inline-block;
      width: 15px;
      height: 15px;
      margin-right: 6px;
      vertical-align: middle;
      border: 1px solid #999;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      z-index: 2000;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="loading" id="loading">
    Caricamento della mappa... 🇮🇹
  </div>

  <header>
    <h1>Comuni d’Italia 🇮🇹</h1>
    <div id="progress">0%</div>
    <div id="counter">0 comuni visitati</div>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://unpkg.com/topojson-client@3"></script>

  <script src="visitati.js"></script>

  <script>
    const TOTAL_COMUNI = 7896;

    const comuniVisitati =
      window.COMUNI_VISITATI ||
      window.VISITATI ||
      window.visitati ||
      [];

    function normalizza(testo) {
      return String(testo || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    const visitatiSet = new Set(
      comuniVisitati.map(normalizza)
    );

    const map = L.map("map", {
      zoomControl: true
    }).setView([42.5, 12.5], 6);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);

    function stileComune(feature) {
      const nome =
        feature.properties?.name ||
        feature.properties?.NAME ||
        feature.properties?.comune ||
        "";

      const visitato = visitatiSet.has(normalizza(nome));

      return {
        color: "#666",
        weight: 0.4,
        fillColor: visitato ? "#35a853" : "#d0d0d0",
        fillOpacity: visitato ? 0.85 : 0.7
      };
    }

    function suComune(feature, layer) {
      const nome =
        feature.properties?.name ||
        feature.properties?.NAME ||
        feature.properties?.comune ||
        "Comune";

      layer.bindTooltip(nome, {
        sticky: true
      });

      layer.on({
        mouseover: function(e) {
          e.target.setStyle({
            weight: 1.5,
            color: "#222",
            fillOpacity: 0.95
          });
        },

        mouseout: function(e) {
          e.target.setStyle(stileComune(feature));
        }
      });
    }

    fetch(
      "https://raw.githubusercontent.com/guglielmo/geojson-italy/main/topojson/limits_IT_municipalities.topo.json"
    )
      .then(response => {
        if (!response.ok) {
          throw new Error("Errore nel caricamento dei dati");
        }
        return response.json();
      })

      .then(topology => {

        const objectName = Object.keys(topology.objects).find(
          key => topology.objects[key].type === "GeometryCollection"
        );

        if (!objectName) {
          throw new Error("Dati dei comuni non trovati");
        }

        const geojson = topojson.feature(
          topology,
          topology.objects[objectName]
        );

        L.geoJSON(geojson, {
          style: stileComune,
          onEachFeature: suComune
        }).addTo(map);

        aggiornaStatistiche(geojson.features.length);

        document.getElementById("loading").style.display = "none";
      })

      .catch(error => {
        console.error(error);

        document.getElementById("loading").innerHTML =
          "❌ Errore nel caricamento della mappa.<br><br>Riprova tra poco.";
      });

    function aggiornaStatistiche(totaleMappa) {

      const visitati = comuniVisitati.length;

      const percentuale =
        (visitati / TOTAL_COMUNI) * 100;

      document.getElementById("progress").textContent =
        percentuale.toFixed(2) + "% completato";

      document.getElementById("counter").textContent =
        visitati + " comuni visitati su " + TOTAL_COMUNI;
    }

    const legend = L.control({
      position: "bottomright"
    });

    legend.onAdd = function() {

      const div = L.DomUtil.create(
        "div",
        "legend"
      );

      div.innerHTML =
        '<div><span style="background:#35a853"></span> Visitato</div>' +
        '<div><span style="background:#d0d0d0"></span> Da visitare</div>';

      return div;
    };

    legend.addTo(map);
  </script>

</body>
</html>
