<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Comune — Comuni d’Italia 🇮🇹</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
rel="stylesheet">

<style>

:root{
--paper:#f7f3e9;
--white:#fffdf8;
--ink:#20221f;
--muted:#6e7069;
--green:#2f6f4e;
--line:#ddd7ca;
}

*{
box-sizing:border-box;
}

body{
margin:0;

background:var(--paper);

color:var(--ink);

font-family:"DM Sans",sans-serif;
}

.page{
max-width:1000px;

margin:auto;

padding:20px 22px 50px;
}

.top{
height:50px;

display:flex;
align-items:center;
}

.brand{
font-family:"Playfair Display",serif;

font-size:21px;
font-weight:700;
}

.menu-button{
position:fixed;

right:22px;
top:19px;

z-index:4000;

border:0;

background:transparent;

font-size:30px;

cursor:pointer;
}

.menu-overlay{
position:fixed;

inset:0;

background:rgba(20,25,21,.45);

backdrop-filter:blur(3px);

opacity:0;

pointer-events:none;

transition:.25s;

z-index:4998;
}

.menu-overlay.open{
opacity:1;

pointer-events:auto;
}

.side-menu{
position:fixed;

z-index:5000;

top:0;
right:0;

width:min(430px,92vw);

height:100dvh;

background:var(--paper);

padding:24px 28px;

transform:translateX(105%);

transition:.3s;

display:flex;
flex-direction:column;
}

.side-menu.open{
transform:translateX(0);
}

.menu-top{
display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:55px;
}

.menu-brand{
font-family:"Playfair Display",serif;

font-size:20px;

font-weight:700;
}

.menu-close{
width:40px;
height:40px;

border:1px solid var(--line);

border-radius:50%;

background:var(--white);

font-size:27px;

cursor:pointer;
}

.menu-section{
margin-bottom:30px;
}

.menu-heading{
margin-bottom:10px;

color:var(--green);

font-size:10px;

font-weight:700;

letter-spacing:.18em;
}

.menu-link{
display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid var(--line);

text-decoration:none;

font-size:18px;
}

.menu-quote{
margin-top:auto;

border-top:1px solid var(--line);

padding-top:22px;

font-family:"Playfair Display",serif;

font-size:20px;

line-height:1.25;

font-weight:600;
}

.menu-quote div:last-child{
color:var(--green);
}

.content{
padding:90px 0;

max-width:780px;
}

.kicker{
color:var(--green);

font-size:10px;

font-weight:700;

letter-spacing:.2em;
}

h1{
margin:12px 0 12px;

font-family:"Playfair Display",serif;

font-size:clamp(55px,8vw,90px);

line-height:.92;
}

.meta{
font-size:16px;

color:var(--muted);
}

.status{
margin-top:45px;

padding:25px;

background:var(--white);

border:1px solid var(--line);
}

.status strong{
display:block;

font-family:"Playfair Display",serif;

font-size:30px;
}

.status p{
color:var(--muted);

line-height:1.6;
}

.visited{
color:var(--green);
}

.todo{
color:var(--muted);
}

.back{
display:inline-block;

margin-top:25px;

font-size:13px;

font-weight:700;

text-decoration:none;
}

.footer{
border-top:1px solid var(--line);

padding-top:22px;

color:var(--muted);

font-size:12px;
}

</style>

</head>

<body>

<div class="page">

<header class="top">

<div class="brand">
Comuni d’Italia 🇮🇹
</div>

</header>


<button
class="menu-button"
id="menuButton">
⋯
</button>


<div
class="menu-overlay"
id="menuOverlay">
</div>


<aside
class="side-menu"
id="sideMenu">

<div class="menu-top">

<div class="menu-brand">
Comuni d’Italia 🇮🇹
</div>

<button
class="menu-close"
id="menuClose">
×
</button>

</div>


<div class="menu-section">

<div class="menu-heading">
IL PROGETTO
</div>

<a
class="menu-link"
href="chi-sono.html">

<span>Chi sono</span>
<span>→</span>

</a>

</div>


<div class="menu-section">

<div class="menu-heading">
IL VIAGGIO
</div>

<a
class="menu-link"
href="mappa.html">

<span>Mappa</span>
<span>→</span>

</a>

</div>


<div class="menu-section">

<div class="menu-heading">
CONTATTI
</div>

<a
class="menu-link"
href="contatti.html">

<span>Contatti</span>
<span>→</span>

</a>

</div>


<div class="menu-quote">

<div>Un comune alla volta.</div>
<div>Una strada alla volta.</div>
<div>Tutta l’Italia. 🇮🇹</div>

</div>

</aside>


<main class="content">

<div class="kicker">
COMUNE
</div>

<h1 id="name">
Comune
</h1>

<div class="meta" id="meta">
Caricamento…
</div>


<div class="status">

<strong id="status">
Da visitare
</strong>

<p id="details">
Caricamento…
</p>

</div>


<a
class="back"
href="mappa.html">

← TORNA ALLA MAPPA

</a>

</main>


<footer class="footer">
Comuni d’Italia 🇮🇹
</footer>

</div>


<script src="visitati.js"></script>
<script src="comuni.js"></script>


<script>

const menuButton=
document.getElementById("menuButton");

const menuClose=
document.getElementById("menuClose");

const menuOverlay=
document.getElementById("menuOverlay");

const sideMenu=
document.getElementById("sideMenu");


function openMenu(){

sideMenu.classList.add("open");
menuOverlay.classList.add("open");

menuButton.style.opacity="0";
menuButton.style.pointerEvents="none";

document.body.style.overflow="hidden";

}


function closeMenu(){

sideMenu.classList.remove("open");
menuOverlay.classList.remove("open");

menuButton.style.opacity="1";
menuButton.style.pointerEvents="auto";

document.body.style.overflow="";

}


menuButton.onclick=openMenu;
menuClose.onclick=closeMenu;
menuOverlay.onclick=closeMenu;


const params =
new URLSearchParams(
window.location.search
);

const code =
String(
params.get("codice") || ""
).padStart(6,"0");


const data =
(window.COMUNI_DATA || {})[code];


const visited =
new Set(
(window.VISITED_ISTAT || [])
.map(String)
.map(x=>x.padStart(6,"0"))
);


if(data){

document.getElementById("name")
.textContent=data.nome || "Comune";

document.getElementById("meta")
.textContent=[
data.provincia,
data.regione,
"ISTAT "+code
]
.filter(Boolean)
.join(" · ");

}else{

document.getElementById("name")
.textContent="Comune";

document.getElementById("meta")
.textContent=
"Codice ISTAT "+code;

}


const status=
document.getElementById("status");

const details=
document.getElementById("details");


if(visited.has(code)){

status.textContent=
"✓ Visitato";

status.className="visited";

details.textContent=
data?.data
? "Comune visitato il "+data.data+"."
: "Questo comune fa già parte del viaggio.";

}else{

status.textContent=
"Da visitare";

status.className="todo";

details.textContent=
"Questo comune è ancora da visitare.";

}

</script>

</body>

</html>
