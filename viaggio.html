<script src="visitati.js"></script>

<script src="app.js"></script>


<script>

const timeline =
  document.getElementById("timeline");

const visited =
  new Set(
    (window.VISITED_ISTAT || [])
      .map(String)
      .map(code => code.padStart(6, "0"))
  );


const entries =
  [...visited]
    .map(code => ({
      code,
      data: window.COMUNI_DATA?.[code] || {}
    }))
    .sort((a, b) =>
      String(b.data.data || "")
        .localeCompare(String(a.data.data || ""))
    );


if (!entries.length) {

  timeline.innerHTML = `
    <div class="card">
      Il viaggio deve ancora iniziare.
    </div>
  `;

} else {

  entries.forEach(entry => {

    const item =
      document.createElement("div");

    item.className = "timeline-item";

    item.innerHTML = `

      <div class="timeline-date">
        ${entry.data.data || "Tappa"}
      </div>

      <div class="timeline-content">

        <h3>
          ${entry.data.nome || "Comune"}
        </h3>

        <p>
          ${entry.data.provincia || ""}
          ${entry.data.provincia && entry.data.regione ? " · " : ""}
          ${entry.data.regione || ""}
        </p>

        ${
          entry.data.descrizione
            ? `<p>${entry.data.descrizione}</p>`
            : ""
        }

        <a
          href="comune.html?codice=${entry.code}"
          class="btn">
          Apri scheda →
        </a>

      </div>

    `;

    timeline.appendChild(item);

  });

}

</script>
