<script src="comuni.js"></script>
<script src="app.js"></script>


<script>

const count =
  (window.VISITED_ISTAT || []).length;


const milestones = [
  {
    value: 10,
    label: "Primi 10 comuni"
  },
  {
    value: 50,
    label: "50 comuni"
  },
  {
    value: 100,
    label: "100 comuni"
  },
  {
    value: 500,
    label: "500 comuni"
  },
  {
    value: 1000,
    label: "1.000 comuni"
  }
];


const box =
  document.getElementById("milestones");


milestones.forEach(milestone => {

  const unlocked =
    count >= milestone.value;

  const item =
    document.createElement("div");

  item.className =
    "milestone " +
    (unlocked ? "" : "locked");

  item.innerHTML = `

    <div class="eyebrow">
      ${unlocked ? "✓ Raggiunto" : "Da raggiungere"}
    </div>

    <div class="milestone-number">
      ${milestone.value.toLocaleString("it-IT")}
    </div>

    <h3>
      ${milestone.label}
    </h3>

  `;

  box.appendChild(item);

});


const percentMilestone =
  document.createElement("div");

percentMilestone.className =
  "milestone";

percentMilestone.innerHTML = `

  <div class="eyebrow">
    Il traguardo finale
  </div>

  <div class="milestone-number">
    100%
  </div>

  <h3>
    Tutti i comuni d'Italia 🇮🇹
  </h3>

  <p>
    L'obiettivo finale del viaggio.
  </p>

`;

box.appendChild(percentMilestone);

</script>
